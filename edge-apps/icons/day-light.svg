<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Daylight - split day night</title>
  <defs>
    <clipPath id="icon">
      <rect width="240" height="240" rx="36"/>
    </clipPath>
  </defs>

  <g clip-path="url(#icon)">
    <!-- Night (left) -->
    <rect width="120" height="240" fill="#0A0F24"/>
    <circle cx="72" cy="100" r="28" fill="#D7DFF5"/>
    <circle cx="82" cy="92" r="24" fill="#0A0F24"/>
    <circle cx="48" cy="160" r="2.5" fill="#FFF" fill-opacity="0.7"/>
    <circle cx="90" cy="175" r="2" fill="#FFF" fill-opacity="0.55"/>
    <circle cx="60" cy="190" r="1.5" fill="#FFF" fill-opacity="0.45"/>

    <!-- Day (right) -->
    <rect x="120" width="120" height="240" fill="#F4C15A"/>
    <circle cx="168" cy="100" r="32" fill="#FFE08A"/>
    <circle cx="168" cy="100" r="20" fill="#FFF3C8"/>

    <!-- Center divider -->
    <line
      x1="120"
      y1="0"
      x2="120"
      y2="240"
      stroke="#FFF"
      stroke-opacity="0.35"
      stroke-width="2"
    />
  </g>
</svg>
